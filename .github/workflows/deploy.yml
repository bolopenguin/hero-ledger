name: Deploy

# Every push to main is checked and, if everything passes, published to GitHub Pages.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Only one deploy at a time; a running deploy is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node and dependencies
        uses: ./.github/actions/setup

      - name: Check formatting
        run: yarn lint

      - name: Type-check
        run: yarn check

      - name: Run the tests
        run: yarn test

      - name: Build the site
        run: yarn build
        env:
          # GitHub Pages serves the site under /<repository-name>/.
          BASE_PATH: /${{ github.event.repository.name }}

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
